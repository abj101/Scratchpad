name: Scratchpad
deploymentTarget:
  macOS: 14.0

packages:
  CanvasKit:
    path: .

targets:
  Scratchpad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Scratchpad
    dependencies:
      - package: CanvasKit
    info:
      path: Config/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.local.scratchpad.note
            UTTypeDescription: Scratchpad Note
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [scratch]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Scratchpad
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: 5.0
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.local.scratchpad

schemes:
  Scratchpad:
    build:
      targets:
        Scratchpad: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
